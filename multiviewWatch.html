<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>치즈 플래터 - 멀티뷰 시청</title>
    <script src="src/themeInit.js"></script>
    <link rel="stylesheet" href="src/popup.css" />
    <link rel="stylesheet" href="src/multiview.css" />
  </head>
  <body class="mv-watch-body">
    <!-- 최상단 조작 막대: 메인 채널·채팅 채널·채팅 위치·배치를 바꾼다. -->
    <header class="mv-topbar" id="mvTopbar" hidden>
      <div class="mv-pop" data-mv-pop="main">
        <button
          type="button"
          class="mv-pop-button"
          data-mv-pop-toggle="main"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          <span class="mv-pop-label">메인 채널</span>
          <span class="mv-pop-value" id="mvMainValue">-</span>
        </button>
        <div class="mv-pop-panel" role="listbox" id="mvMainPanel" hidden></div>
      </div>

      <div class="mv-pop" data-mv-pop="chat">
        <button
          type="button"
          class="mv-pop-button"
          data-mv-pop-toggle="chat"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          <span class="mv-pop-label">채팅</span>
          <span class="mv-pop-value" id="mvChatValue">-</span>
        </button>
        <div class="mv-pop-panel" role="listbox" id="mvChatPanel" hidden></div>
      </div>

      <button type="button" class="mv-chat-follow mv-custom-tooltip" id="mvChatFollow"
        aria-pressed="true" data-tooltip="메인 채널을 바꾸면 채팅도 같이 바꾼다">
        메인 따라가기
      </button>

      <button type="button" class="mv-pop-button mv-topbar-chat-expand" id="mvChatExpand"
        aria-controls="mvChatBody" aria-expanded="false" hidden>채팅 펴기</button>

      <div class="mv-chat-popup-control" id="mvChatPopupControl" hidden>
        <span class="mv-chat-popup-status-live" id="mvChatPopupStatus" role="status" aria-live="polite">치지직 채팅창에서 표시 중</span>
        <button type="button" class="mv-pop-button mv-topbar-chat-expand mv-chat-popup-return" id="mvChatPopupReturn"
          data-tooltip="채팅 팝업에서 표시 중">이 창에서 보기</button>
      </div>

      <div class="mv-pop" data-mv-pop="side">
        <button
          type="button"
          class="mv-pop-button"
          data-mv-pop-toggle="side"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          <span class="mv-pop-label">채팅 위치</span>
          <span class="mv-pop-value" id="mvSideValue">-</span>
        </button>
        <div class="mv-pop-panel" role="listbox" id="mvSidePanel" hidden></div>
      </div>

      <div class="mv-pop" data-mv-pop="layout">
        <button
          type="button"
          class="mv-pop-button"
          data-mv-pop-toggle="layout"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          <span class="mv-pop-label">배치</span>
          <span class="mv-pop-value" id="mvLayoutValue">-</span>
        </button>
        <div
          class="mv-pop-panel mv-pop-panel-grid"
          role="listbox"
          id="mvLayoutPanel"
          hidden
        ></div>
      </div>

      <div class="mv-pop" data-mv-pop="volume">
        <button
          type="button"
          class="mv-pop-button"
          data-mv-pop-toggle="volume"
          id="mvVolumeBtn"
          aria-haspopup="dialog"
          aria-expanded="false"
        >
          <span class="mv-pop-label">볼륨</span>
          <span class="mv-volume-state-icon" id="mvVolumeStatusIcon" aria-hidden="true"></span>
          <span class="mv-pop-value" id="mvVolumeValue">-</span>
        </button>
        <div class="mv-pop-panel mv-volume-pop" id="mvVolumePop" hidden></div>
      </div>

      <div class="mv-pop" data-mv-pop="stats">
        <button
          type="button"
          class="mv-pop-button"
          data-mv-pop-toggle="stats"
          id="mvStatsBtn"
          aria-haspopup="dialog"
          aria-expanded="false"
        >
          <span class="mv-pop-label">스트림 정보</span>
          <span class="mv-pop-value" id="mvStatsValue">-</span>
        </button>
        <div class="mv-pop-panel mv-stats-pop" id="mvStatsPop" hidden>
          <label class="mv-stats-catch-up mv-option-toggle">
            <span id="mvStatsCatchUpLabel">자동 따라잡기 · 8초 이상</span>
            <input type="checkbox" id="mvStatsCatchUp" checked />
            <span class="mv-option-switch" aria-hidden="true"></span>
          </label>
          <table class="mv-stats-table">
            <thead><tr><th>채널</th><th>지연</th><th>따라잡기</th><th>해상도</th><th>FPS</th><th>비트레이트</th></tr></thead>
            <tbody id="mvStatsRows"></tbody>
          </table>
        </div>
      </div>

      <div class="mv-pop" data-mv-pop="quality">
        <button
          type="button"
          class="mv-pop-button"
          data-mv-pop-toggle="quality"
          id="mvQualityBtn"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-label="채널별 화질 설정"
        >
          <span class="mv-pop-label">채널별 화질</span>
          <span class="mv-pop-value" id="mvQualityValue">-</span>
        </button>
        <div
          class="mv-pop-panel mv-quality-pop"
          id="mvQualityPop"
          role="dialog"
          aria-label="채널별 화질 설정"
          aria-busy="false"
          hidden
        ></div>
      </div>

      <div class="mv-pop" data-mv-pop="sync">
        <button
          type="button"
          class="mv-pop-button"
          data-mv-pop-toggle="sync"
          id="mvSyncBtn"
          aria-haspopup="dialog"
          aria-expanded="false"
        >
          <span class="mv-pop-label">싱크</span>
          <span class="mv-pop-value" id="mvSyncValue">꺼짐</span>
        </button>
        <div
          class="mv-pop-panel mv-sync-pop"
          id="mvSyncPop"
          role="dialog"
          aria-label="라이브 싱크"
          hidden
        ></div>
      </div>

      <button type="button" class="mv-topbar-back" id="mvBack">
        채널 관리
      </button>

      <button
        type="button"
        class="mv-theme-toggle mv-custom-tooltip"
        id="mvTheme"
        aria-pressed="false"
        aria-label="다크 모드로 전환"
        data-tooltip="테마 전환"
      >
        <svg
          class="mv-theme-sun"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4"></circle>
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          ></path>
        </svg>
        <svg
          class="mv-theme-moon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
        </svg>
      </button>
    </header>

    <main class="mv-stage" id="mvStage">
      <div class="mv-frames-fit" id="mvFramesFit">
        <!-- 격자 위아래 남는 자리에 뜬다. 여기서 바로 채널을 빼거나 바꿀 수 있어
             고르기 화면까지 가지 않아도 된다. -->
        <div class="mv-quick" id="mvQuick" hidden>
          <div class="mv-quick-head">
            <strong>채널 관리</strong>
            <span class="mv-quick-hint mv-custom-tooltip" id="mvQuickHint"></span>
            <div class="mv-quick-head-actions" id="mvQuickHeadActions">
              <button type="button" class="mv-quick-all" id="mvQuickAll">
                고르기 화면 열기
              </button>
              <button
                type="button"
                class="mv-quick-close"
                id="mvQuickClose"
                aria-label="닫기"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"></path></svg>
              </button>
            </div>
          </div>
          <div class="mv-quick-body">
            <ul class="mv-quick-current" id="mvQuickCurrent"></ul>
            <div
              class="mv-quick-tabs"
              id="mvQuickTabs"
              aria-label="채널 목록 종류"
            >
              <button type="button" data-mv-quick-source="following">
                팔로잉
              </button>
              <button type="button" data-mv-quick-source="custom">
                전용 팔로잉
              </button>
              <button type="button" data-mv-quick-source="live">라이브</button>
              <button type="button" data-mv-quick-source="search">검색</button>
              <button type="button" data-mv-quick-source="videos">다시보기</button>
            </div>
            <div class="mv-video-sources mv-quick-video-sources" id="mvQuickVideoSources" aria-label="다시보기 목록" hidden>
              <button type="button" data-mv-quick-video-source="following">팔로잉</button>
              <button type="button" class="mv-custom-tooltip" data-mv-quick-video-source="popular" data-tooltip="모든 방송에서 인기 정렬">인기</button>
              <button type="button" class="mv-custom-tooltip" data-mv-quick-video-source="latest" data-tooltip="모든 방송에서 최신 정렬">최신</button>
              <button type="button" data-mv-quick-video-source="favorites">즐겨찾기</button>
              <div class="mv-video-channel-source-cell">
                <button type="button" data-mv-quick-video-source="channel-search">채널 검색</button>
                <button type="button" class="mv-video-channel-selected mv-custom-tooltip" data-mv-quick-video-channel-back data-tooltip="선택한 채널 목록" data-tooltip-icon-only aria-label="선택한 채널 목록" hidden>
                  <svg class="lucide lucide-list-video" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12H3"></path><path d="M16 6H3"></path><path d="M12 18H3"></path><path d="m16 12 5-3v6z"></path></svg>
                  <span class="mv-video-channel-selected-label" data-tooltip-label>선택한 채널 목록</span>
                </button>
              </div>
              <button type="button" data-mv-quick-video-source="platter-search">치즈 플래터 재정렬</button>
            </div>
            <div
              class="mv-quick-folders"
              id="mvQuickFolders"
              aria-label="전용 팔로잉 구역"
              hidden
            ></div>
            <input
              type="search"
              class="mv-quick-search"
              id="mvQuickSearch"
              placeholder="채널 이름 또는 태그로 찾기"
              hidden
            />
            <div class="mv-video-search-wrap mv-quick-video-search-wrap" id="mvQuickVideoChannelSearch" hidden>
              <input type="search" class="mv-quick-search" id="mvQuickVideoChannelSearchInput" placeholder="채널명을 입력하세요" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="mvQuickVideoChannelPopover" aria-expanded="false" />
              <div class="mv-video-channel-popover mv-quick-video-channel-popover" id="mvQuickVideoChannelPopover" role="listbox" aria-label="채널 검색 결과" hidden></div>
            </div>
            <div class="mv-video-search-wrap mv-quick-video-search-wrap" id="mvQuickVideoRerankSearch" hidden>
              <input type="search" class="mv-quick-search" id="mvQuickVideoRerankSearchInput" placeholder="다시보기 검색어" autocomplete="off" />
              <div id="mvQuickVideoRerankControls"></div>
            </div>
            <div class="mv-sort-row">
              <span id="mvQuickSortLabel">정렬</span>
              <div class="mv-pop mv-sort-picker">
                <button type="button" class="mv-pop-button mv-sort-trigger" id="mvQuickSortTrigger"
                  aria-haspopup="listbox" aria-expanded="false"
                  aria-labelledby="mvQuickSortLabel mvQuickSortValue">
                  <span class="mv-pop-value" id="mvQuickSortValue">시청자순</span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </button>
                <div class="mv-pop-panel mv-sort-options" role="listbox"
                  aria-labelledby="mvQuickSortLabel" hidden></div>
                <select id="mvQuickSort" class="mv-sort-native" aria-hidden="true" tabindex="-1"></select>
              </div>
            </div>
            <div class="mv-quick-rail">
              <div class="mv-quick-add" id="mvQuickAdd"></div>
            </div>
          </div>
          <button
            type="button"
            class="mv-quick-resize mv-custom-tooltip"
            id="mvQuickResize"
            aria-label="채널 관리 패널 크기 조절"
            data-tooltip="채널 관리 패널 크기 조절"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M21 9a12 12 0 0 1-12 12"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <div class="mv-frames" id="mvFrames"></div>
      </div>
      <!-- 채팅 크기 조절 손잡이. 채팅과 격자 사이를 끈다. -->
      <div
        class="mv-chat-resize"
        id="mvChatResize"
        role="separator"
        aria-orientation="vertical"
        aria-label="채팅 크기 조절"
        tabindex="0"
      ></div>
      <div class="mv-chat-top-resize" id="mvChatTopResize" role="separator"
        aria-orientation="horizontal"
        aria-label="채팅 위 영상 높이 조절 (더블클릭하면 자동 높이)"
        aria-valuemin="100" tabindex="0"></div>
      <aside class="mv-chat" id="mvChat">
        <div class="mv-chat-head">
          <div class="mv-chat-title-wrap" id="mvChatTitleWrap">
          <button type="button" class="mv-pop-button mv-chat-title" id="mvChatTitle"
            aria-haspopup="listbox" aria-expanded="false" aria-controls="mvChatTitleList">
              <span class="mv-chat-title-label"></span>
              <svg class="mv-chat-title-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <div class="mv-pop-panel mv-chat-title-list" id="mvChatTitleList" role="listbox"
              aria-label="채팅 채널" hidden></div>
          </div>
          <button type="button" class="mv-custom-tooltip" id="mvChatPopout"
            aria-label="채팅 분리"
            data-tooltip="치지직 채팅창을 엽니다. 다른 채팅 확장 프로그램을 사용할 수 있습니다.">
            채팅 분리
          </button>
          <span class="mv-chat-popout-feedback" id="mvChatPopoutFeedback" role="status" hidden></span>
          <button type="button" id="mvChatToggle" aria-label="채팅 접기"
            aria-controls="mvChatBody" aria-expanded="true">
            접기
          </button>
        </div>
        <div class="mv-chat-body" id="mvChatBody">
          <iframe
            id="mvChatFrame"
            title="채팅"
            allow="autoplay"
            referrerpolicy="origin"
          ></iframe>
          <div class="mv-vod-chat-feed" id="mvVodChatFeed" hidden>
            <div class="mv-vod-chat-scale" role="group" aria-label="채팅 크기 조절">
              <div class="mv-vod-badge-chat-anchor" id="mvVodBadgeChatAnchor">
                <button type="button" class="mv-badge-chat-trigger is-empty" id="mvVodBadgeChatTrigger"
                  aria-expanded="false" aria-haspopup="dialog" aria-controls="mvVodBadgeChatPopover">
                  <span class="mv-badge-chat-badges" id="mvVodBadgeChatBadges" aria-hidden="true"></span>
                  <svg class="mv-badge-chat-compact-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.25 4.5h13.5A2.25 2.25 0 0 1 21 6.75v7.5a2.25 2.25 0 0 1-2.25 2.25H10l-4.4 3.3a.75.75 0 0 1-1.2-.6v-2.83a2.25 2.25 0 0 1-1.4-2.12v-7.5A2.25 2.25 0 0 1 5.25 4.5Z"></path></svg>
                  <span class="mv-badge-chat-label" id="mvVodBadgeChatLabel">새 채팅 없음</span>
                  <span class="mv-badge-chat-count" id="mvVodBadgeChatCount" hidden></span>
                </button>
                <section class="mv-badge-chat-popover" id="mvVodBadgeChatPopover"
                  role="dialog" aria-label="배지 채팅 모아보기" hidden>
                  <header class="mv-badge-chat-popover-head">
                    <strong>배지 채팅 모아보기</strong>
                    <button type="button" class="mv-badge-chat-popover-close" id="mvVodBadgeChatClose"
                      aria-label="배지 채팅 팝오버 닫기">
                      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"></path></svg>
                    </button>
                  </header>
                  <div class="mv-badge-chat-empty" id="mvVodBadgeChatEmpty">배지 채팅 없음</div>
                  <div class="mv-badge-chat-list" id="mvVodBadgeChatList" role="log" aria-live="off"></div>
                  <div class="mv-badge-chat-resize" id="mvVodBadgeChatResize" role="separator"
                    aria-orientation="horizontal" aria-label="배지 채팅 팝오버 높이 조절"
                    aria-valuemin="120" aria-valuemax="720" aria-valuenow="320" tabindex="0"></div>
                </section>
              </div>
              <div class="mv-vod-chat-font-scale" role="group" aria-label="채팅 글자 크기">
                <button type="button" id="mvVodChatScaleDown" aria-label="채팅 크기 마이너스" disabled>
                  <svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M1.196 7c0-.419.34-.758.758-.758h10.092a.758.758 0 0 1 0 1.516H1.954A.758.758 0 0 1 1.196 7Z" clip-rule="evenodd"></path></svg>
                </button>
                <span id="mvVodChatScaleValue" aria-live="off">100%</span>
                <button type="button" id="mvVodChatScaleUp" aria-label="채팅 크기 플러스">
                  <svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" aria-hidden="true"><path fill="currentColor" d="M7.759 1.954a.758.758 0 1 0-1.517 0v4.288H1.954a.758.758 0 0 0 0 1.516h4.288v4.288a.758.758 0 0 0 1.517 0V7.758h4.287a.758.758 0 1 0 0-1.516H7.759V1.954Z"></path></svg>
                </button>
              </div>
            </div>
            <div class="mv-vod-chat-meta" id="mvVodChatMeta">
              <span id="mvVodChatClock" aria-live="off"></span>
              <button type="button" class="mv-custom-tooltip" id="mvVodChatTimeMode" aria-pressed="true"
                aria-label="재생 시간으로 전환" data-tooltip="재생 시간과 실제 방송 시각 전환">방송 시각</button>
            </div>
            <div class="mv-vod-chat-list-wrap">
              <div class="mv-vod-chat-list" id="mvVodChatList" role="log" aria-live="off"></div>
              <button type="button" class="mv-vod-chat-latest mv-custom-tooltip" id="mvVodChatLatest"
                aria-label="최신 채팅으로 이동" data-tooltip="최신 채팅으로 이동" hidden>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
              </button>
            </div>
            <form class="mv-vod-chat-compose" id="mvVodChatCompose" aria-label="다시보기 로컬 채팅 입력">
              <div class="mv-vod-chat-compose-input-container">
                <span class="mv-vod-chat-compose-avatar" id="mvVodChatComposeAvatar" aria-hidden="true">나</span>
                <textarea class="mv-vod-chat-compose-input" id="mvVodChatComposeInput" maxlength="300" rows="1"
                  placeholder="다시보기 채팅 입력" aria-label="다시보기 로컬 채팅 입력"></textarea>
              </div>
              <div class="mv-vod-chat-compose-tools">
                <span class="mv-vod-chat-compose-indicator" aria-label="이 기기에만 표시되며 실제 채팅으로 전송되지 않습니다">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.25 4.5h13.5A2.25 2.25 0 0 1 21 6.75v7.5a2.25 2.25 0 0 1-2.25 2.25H10l-4.4 3.3a.75.75 0 0 1-1.2-.6v-2.83a2.25 2.25 0 0 1-1.4-2.12v-7.5A2.25 2.25 0 0 1 5.25 4.5Z"></path></svg>
                  <span>이 기기에만 표시</span>
                </span>
