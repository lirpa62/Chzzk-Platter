<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>치즈 플래터 - 멀티뷰 채팅</title>
    <script src="src/themeInit.js"></script>
    <link rel="stylesheet" href="src/popup.css" />
    <link rel="stylesheet" href="src/multiview.css" />
    <link rel="stylesheet" href="src/multiviewChatPopup.css" />
  </head>
  <body class="mv-chat-popup-body">
    <header class="mv-chat-popup-head">
      <div class="mv-chat-popup-heading">
        <strong id="mvChatPopupTitle">멀티뷰 채팅</strong>
        <span id="mvChatPopupStatus" data-state="loading" role="status" aria-live="polite">채팅 연결 중…</span>
      </div>
      <button type="button" class="mv-chat-popup-return" id="mvChatPopupReturn" data-tooltip="멀티뷰 시청 화면에서 채팅 보기">
        이 창에서 보기
      </button>
    </header>
    <main class="mv-chat-popup-view" id="mvChatPopupView">
      <iframe id="mvChatPopupFrame" title="채팅" allow="autoplay" referrerpolicy="origin"></iframe>
      <div class="mv-chat-popup-vod" id="mvChatPopupVod" hidden>
        <div class="mv-vod-chat-scale mv-chat-popup-vod-scale" role="group" aria-label="채팅 표시 설정">
          <div class="mv-vod-badge-chat-anchor" id="mvChatPopupBadgeAnchor">
            <button type="button" class="mv-badge-chat-trigger is-empty" id="mvChatPopupBadgeTrigger"
              aria-expanded="false" aria-haspopup="dialog" aria-controls="mvChatPopupBadgePopover">
              <span class="mv-badge-chat-badges" id="mvChatPopupBadgeBadges" aria-hidden="true"></span>
              <svg class="mv-badge-chat-compact-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.25 4.5h13.5A2.25 2.25 0 0 1 21 6.75v7.5a2.25 2.25 0 0 1-2.25 2.25H10l-4.4 3.3a.75.75 0 0 1-1.2-.6v-2.83a2.25 2.25 0 0 1-1.4-2.12v-7.5A2.25 2.25 0 0 1 5.25 4.5Z"></path></svg>
              <span class="mv-badge-chat-label" id="mvChatPopupBadgeLabel">새 채팅 없음</span>
              <span class="mv-badge-chat-count" id="mvChatPopupBadgeCount" hidden></span>
            </button>
            <section class="mv-badge-chat-popover" id="mvChatPopupBadgePopover"
              role="dialog" aria-label="배지 채팅 모아보기" hidden>
              <header class="mv-badge-chat-popover-head">
                <strong>배지 채팅 모아보기</strong>
                <button type="button" class="mv-badge-chat-popover-close" id="mvChatPopupBadgeClose"
                  aria-label="배지 채팅 팝오버 닫기">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"></path></svg>
                </button>
              </header>
              <div class="mv-badge-chat-empty" id="mvChatPopupBadgeEmpty">배지 채팅 없음</div>
              <div class="mv-badge-chat-list" id="mvChatPopupBadgeList" role="log" aria-live="off"></div>
              <div class="mv-badge-chat-resize" id="mvChatPopupBadgeResize" role="separator"
                aria-orientation="horizontal" aria-label="배지 채팅 팝오버 높이 조절"
                aria-valuemin="120" aria-valuemax="720" aria-valuenow="320" tabindex="0"></div>
            </section>
          </div>
          <div class="mv-vod-chat-font-scale" role="group" aria-label="채팅 글자 크기">
            <button type="button" id="mvChatPopupVodScaleDown" aria-label="채팅 크기 마이너스" disabled>
              <svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M1.196 7c0-.419.34-.758.758-.758h10.092a.758.758 0 0 1 0 1.516H1.954A.758.758 0 0 1 1.196 7Z" clip-rule="evenodd"></path></svg>
            </button>
            <span id="mvChatPopupVodScaleValue" aria-live="off">100%</span>
            <button type="button" id="mvChatPopupVodScaleUp" aria-label="채팅 크기 플러스">
              <svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" aria-hidden="true"><path fill="currentColor" d="M7.759 1.954a.758.758 0 1 0-1.517 0v4.288H1.954a.758.758 0 0 0 0 1.516h4.288v4.288a.758.758 0 0 0 1.517 0V7.758h4.287a.758.758 0 1 0 0-1.516H7.759V1.954Z"></path></svg>
            </button>
          </div>
        </div>
        <div class="mv-vod-chat-list-wrap">
          <div class="mv-vod-chat-list" id="mvChatPopupVodList" aria-live="polite"></div>
          <button type="button" class="mv-vod-chat-latest" id="mvChatPopupVodLatest"
            aria-label="최신 채팅으로 이동" title="최신 채팅으로 이동" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
        </div>
        <form class="mv-vod-chat-compose mv-chat-popup-vod-compose" id="mvChatPopupVodCompose"
          aria-label="다시보기 로컬 채팅 입력">
          <div class="mv-vod-chat-compose-input-container">
            <span class="mv-vod-chat-compose-avatar" id="mvChatPopupVodComposeAvatar" aria-hidden="true">나</span>
            <textarea class="mv-vod-chat-compose-input" id="mvChatPopupVodComposeInput" maxlength="300" rows="1"
              placeholder="다시보기 채팅 입력" aria-label="다시보기 로컬 채팅 입력"></textarea>
          </div>
          <div class="mv-vod-chat-compose-tools">
            <span class="mv-vod-chat-compose-indicator" aria-label="이 기기에만 표시되며 실제 채팅으로 전송되지 않습니다">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.25 4.5h13.5A2.25 2.25 0 0 1 21 6.75v7.5a2.25 2.25 0 0 1-2.25 2.25H10l-4.4 3.3a.75.75 0 0 1-1.2-.6v-2.83a2.25 2.25 0 0 1-1.4-2.12v-7.5A2.25 2.25 0 0 1 5.25 4.5Z"></path></svg>
              <span>이 기기에만 표시</span>
            </span>
            <button type="submit" id="mvChatPopupVodComposeSend" disabled>채팅</button>
          </div>
        </form>
      </div>
      <div class="mv-chat-popup-overlay" id="mvChatPopupOverlay" role="status" aria-live="polite">
        <span id="mvChatPopupMessage">연결 준비 중…</span>
        <button type="button" id="mvChatPopupRetry" hidden>다시 연결</button>
      </div>
    </main>
    <script src="src/replayLocalChat.js"></script>
    <script src="src/multiviewBadgeChat.js"></script>
    <script src="src/multiviewChatPopup.js"></script>
  </body>
</html>
